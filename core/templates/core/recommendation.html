<link rel="stylesheet" href="{% static 'core/css/style.css' %}">

<style>
    .recommendation-page {
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
    }

    .recommendation-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .recommendation-header h1 {
        font-size: 36px;
        margin-bottom: 10px;
    }

    .recommendation-header p {
        color: #666;
        font-size: 17px;
    }

    .recommendation-card {
        background: white;
        border-radius: 18px;
        padding: 30px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        margin-bottom: 25px;
    }

    .recommendation-card h2 {
        margin-bottom: 20px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-sizing: border-box;
    }

    .recommend-btn {
        margin-top: 25px;
        padding: 13px 25px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        background: #2e7d32;
        color: white;
    }

    .recommend-btn:hover {
        opacity: 0.9;
    }

    .result-box {
        display: none;
        background: #f1f8e9;
        border-left: 5px solid #4caf50;
        padding: 20px;
        border-radius: 10px;
        margin-top: 25px;
    }

    .result-box h3 {
        margin-top: 0;
        color: #2e7d32;
    }

    .info-box {
        background: #f1f8e9;
        border-left: 5px solid #4caf50;
        padding: 18px;
        border-radius: 10px;
        margin-top: 25px;
    }
</style>

</head>

<body>

<div class="recommendation-page">

```
<div class="recommendation-header">
    <h1>🌱 Crop Recommendation</h1>
    <p>Enter your field details to get a suitable crop recommendation.</p>
</div>

<div class="recommendation-card">

    <h2>Farm Details</h2>

    <div class="form-grid">

        <div class="form-group">
            <label>Soil Type</label>
            <select id="soil">
                <option value="">Select soil type</option>
                <option value="black">Black Soil</option>
                <option value="red">Red Soil</option>
                <option value="alluvial">Alluvial Soil</option>
                <option value="sandy">Sandy Soil</option>
                <option value="clay">Clay Soil</option>
            </select>
        </div>

        <div class="form-group">
            <label>Temperature (°C)</label>
            <input id="temperature" type="number" placeholder="Example: 28">
        </div>

        <div class="form-group">
            <label>Rainfall (mm)</label>
            <input id="rainfall" type="number" placeholder="Example: 800">
        </div>

        <div class="form-group">
            <label>Land Area (acres)</label>
            <input id="area" type="number" placeholder="Example: 2">
        </div>

    </div>

    <button class="recommend-btn" type="button" onclick="getRecommendation()">
        🌾 Get Recommendation
    </button>

    <div id="result" class="result-box">
        <h3>🌾 Recommended Crop</h3>
        <p id="cropResult"></p>
        <p id="reasonResult"></p>
    </div>

    <div class="info-box">
        <strong>💡 AgriVision Tip</strong>
        <p>
            Soil type, temperature and rainfall are important factors
            when selecting a suitable crop.
        </p>
    </div>

</div>
```

</div>

<script>
function getRecommendation() {

    const soil = document.getElementById("soil").value;
    const temperature = parseFloat(
        document.getElementById("temperature").value
    );
    const rainfall = parseFloat(
        document.getElementById("rainfall").value
    );
    const area = parseFloat(
        document.getElementById("area").value
    );

    let crop = "";
    let reason = "";

    if (!soil || isNaN(temperature) || isNaN(rainfall) || isNaN(area)) {
        alert("Please enter all farm details.");
        return;
    }

    if (
        soil === "black" &&
        temperature >= 20 &&
        temperature <= 35 &&
        rainfall >= 500 &&
        rainfall <= 1200
    ) {
        crop = "Cotton 🌿";
        reason =
            "Black soil has good moisture-retention capacity and " +
            "the given temperature and rainfall are suitable for cotton.";
    }

    else if (
        soil === "alluvial" &&
        temperature >= 20 &&
        temperature <= 35 &&
        rainfall >= 600
    ) {
        crop = "Rice 🌾";
        reason =
            "Alluvial soil is fertile and, with sufficient rainfall, " +
            "is suitable for rice cultivation.";
    }

    else if (
        soil === "red" &&
        temperature >= 20 &&
        temperature <= 32 &&
        rainfall >= 500 &&
        rainfall <= 1000
    ) {
        crop = "Groundnut 🥜";
        reason =
            "Red soil with suitable temperature and rainfall " +
            "can support groundnut cultivation.";
    }

    else if (
        soil === "sandy" &&
        temperature >= 22 &&
        temperature <= 35 &&
        rainfall <= 800
    ) {
        crop = "Millet 🌾";
        reason =
            "Millets can perform well in lighter soils and " +
            "relatively lower rainfall conditions.";
    }

    else if (
        soil === "clay" &&
        temperature >= 20 &&
        temperature <= 35 &&
        rainfall >= 700
    ) {
        crop = "Rice 🌾";
        reason =
            "Clay soil has good water-retention capacity and " +
            "can support rice cultivation when sufficient water is available.";
    }

    else {
        crop = "Maize 🌽";
        reason =
            "Based on the provided soil, temperature and rainfall, " +
            "maize is suggested as a general suitable option.";
    }

    document.getElementById("cropResult").innerHTML =
        "<strong>" + crop + "</strong><br><br>" +
        "🌾 Land Area: " + area + " acre(s)";

    document.getElementById("reasonResult").innerHTML =
        "📌 " + reason;

    document.getElementById("result").style.display = "block";
}
</script>



</body>
</html>
