<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Insights | AgriVision</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f8f3;
            color: #1b4332;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .market-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            margin: 12px 0;
            background: #e8f5e9;
            border-radius: 12px;
        }

        .price {
            font-weight: bold;
            font-size: 20px;
        }

        a {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 12px 25px;
            background: #2d6a4f;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="card">
        <h1>📈 Market Insights</h1>
        <p class="subtitle">Demo crop market information</p>

        <div class="market-item">
            <span>🌾 Rice</span>
            <span class="price">₹2,400 / Quintal</span>
        </div>

        <div class="market-item">
            <span>🌿 Cotton</span>
            <span class="price">₹7,200 / Quintal</span>
        </div>

        <div class="market-item">
            <span>🌽 Maize</span>
            <span class="price">₹2,100 / Quintal</span>
        </div>

        <div class="market-item">
            <span>🥜 Groundnut</span>
            <span class="price">₹6,000 / Quintal</span>
        </div>

        <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
    </div>
</div>
</body>
</html>
